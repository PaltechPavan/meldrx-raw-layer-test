version: 2.1

jobs:
  build-and-push:
    docker:
      - image: cimg/base:stable

    environment:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: meldrx-test-ingest

    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Install AWS CLI
          command: |
            set -e
            sudo apt-get update
            sudo apt-get install -y awscli

      - run:
          name: Authenticate to AWS using CircleCI OIDC
          command: |
            set -e

            if [ -z "${AWS_ROLE_ARN:-}" ]; then
              echo "ERROR: AWS_ROLE_ARN is missing from the meldrx-test context."
              exit 1
            fi

            if [ -z "${CIRCLE_OIDC_TOKEN:-}" ]; then
              echo "ERROR: CircleCI OIDC token is unavailable."
              exit 1
            fi

            umask 077
            printf '%s' "$CIRCLE_OIDC_TOKEN" > /tmp/circleci-oidc-token

            aws sts assume-role-with-web-identity \
              --role-arn "$AWS_ROLE_ARN" \
              --role-session-name "meldrx-test-${CIRCLE_BUILD_NUM}" \
              --web-identity-token file:///tmp/circleci-oidc-token \
              --duration-seconds 3600 \
              > /tmp/aws-credentials.json

            export AWS_ACCESS_KEY_ID="$(python3 -c 'import json; print(json.load(open("/tmp/aws-credentials.json"))["Credentials"]["AccessKeyId"])')"
            export AWS_SECRET_ACCESS_KEY="$(python3 -c 'import json; print(json.load(open("/tmp/aws-credentials.json"))["Credentials"]["SecretAccessKey"])')"
            export AWS_SESSION_TOKEN="$(python3 -c 'import json; print(json.load(open("/tmp/aws-credentials.json"))["Credentials"]["SessionToken"])')"

            aws sts get-caller-identity

            echo "AWS OIDC authentication succeeded."

            rm -f /tmp/circleci-oidc-token /tmp/aws-credentials.json

      - run:
          name: Build and push MeldRx image
          command: |
            set -e

            # Obtain temporary AWS credentials again for this step.
            # CircleCI run steps use separate shells.
            umask 077
            printf '%s' "$CIRCLE_OIDC_TOKEN" > /tmp/circleci-oidc-token

            aws sts assume-role-with-web-identity \
              --role-arn "$AWS_ROLE_ARN" \
              --role-session-name "meldrx-ecr-${CIRCLE_BUILD_NUM}" \
              --web-identity-token file:///tmp/circleci-oidc-token \
              --duration-seconds 3600 \
              > /tmp/aws-credentials.json

            export AWS_ACCESS_KEY_ID="$(python3 -c 'import json; print(json.load(open("/tmp/aws-credentials.json"))["Credentials"]["AccessKeyId"])')"
            export AWS_SECRET_ACCESS_KEY="$(python3 -c 'import json; print(json.load(open("/tmp/aws-credentials.json"))["Credentials"]["SecretAccessKey"])')"
            export AWS_SESSION_TOKEN="$(python3 -c 'import json; print(json.load(open("/tmp/aws-credentials.json"))["Credentials"]["SessionToken"])')"

            ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:v${CIRCLE_BUILD_NUM}"

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            docker build --platform linux/amd64 \
              -t "$IMAGE" ./app

            docker push "$IMAGE"

            rm -f /tmp/circleci-oidc-token /tmp/aws-credentials.json

            echo "Successfully pushed ${IMAGE}"

workflows:
  meldrx-test-pipeline:
    jobs:
      - build-and-push:
          context: meldrx-test
